[project]
name = "jcode"
version = "0.1.0"
description = "Feature-graph code intelligence for AI agents - git-style on-disk store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "click>=8.1",
    "msgpack>=1.1",
    "mcp>=1.0",
]

[project.scripts]
jcode = "jcode.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
embed      = ["sentence-transformers>=2.7"]
typescript = ["tree-sitter-typescript>=0.23"]
javascript = ["tree-sitter-javascript>=0.23"]
go         = ["tree-sitter-go>=0.23"]
rust       = ["tree-sitter-rust>=0.23"]
all-langs  = [
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]
all = [
    "sentence-transformers>=2.7",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/jcode/storage/graph_db.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
