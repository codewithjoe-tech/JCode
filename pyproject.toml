[project]
name = "jcode"
version = "0.5.4"
description = "Feature-graph code intelligence for AI agents — stop grepping, start graphing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Joel Thomas", email = "joel@codewithjoe.in" },
]
keywords = [
    "code-intelligence", "mcp", "claude", "tree-sitter",
    "static-analysis", "ai-agents", "code-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Console",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "click>=8.1",
    "msgpack>=1.1",
    "mcp>=1.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.25.1",
]

[project.urls]
Homepage   = "https://github.com/codewithjoe-tech/jcode"
Repository = "https://github.com/codewithjoe-tech/jcode"
Issues     = "https://github.com/codewithjoe-tech/jcode/issues"

[project.scripts]
jcode = "jcode.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
embed-slow = ["sentence-transformers>=2.7"]
typescript = ["tree-sitter-typescript>=0.23"]
javascript = ["tree-sitter-javascript>=0.23"]
go         = ["tree-sitter-go>=0.23"]
rust       = ["tree-sitter-rust>=0.23"]
all-langs  = [
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]
all = [
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/jcode/storage/graph_db.py" = ["E501"]

[tool.hatch.build.targets.wheel]
exclude = [
    "src/jcode/git_utils.py",
    "src/jcode/indexer/parser.py",
    "src/jcode/indexer/plugins/fastapi_plugin.py",
    "src/jcode/indexer/plugins/django_plugin.py",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/jcode/git_utils.py",
    "src/jcode/indexer/parser.py",
    "src/jcode/indexer/plugins/fastapi_plugin.py",
    "src/jcode/indexer/plugins/django_plugin.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
